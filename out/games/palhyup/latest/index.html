function regionIndexAt(x, y) {
  const dx = x - VILLAGE.x, dy = y - VILLAGE.y
  const d = Math.hypot(dx, dy)
  if (d < VILLAGE.r) return -1
  let a = Math.atan2(dy, dx)
  a = (a + Math.PI * 2 + SECTOR_SPAN / 2) % (Math.PI * 2)
  const sector = Math.floor(a / SECTOR_SPAN) % SECTOR_COUNT
  const ring = d < RINGS[0].r1 ? 0 : 1
  return REGIONS.findIndex(r => r.ring === ring && r.sector === sector)
}

function recalc() {
  const oldMax = player.maxHp
  player.atk = BASE.atk + player.stats.str * 2 + player.atkBonus + weapon().atk

  if (player.maxHp > oldMax) player.hp += player.maxHp - oldMax
  player.hp = Math.min(player.hp, player.maxHp)
}

  } catch (err) {}
}

/* ---------- 소리 ---------- */
let audio = null
function ensureAudio() {
  if (!soundOn) return
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)()
    if (audio.state === 'suspended') audio.resume()
  } catch (err) { audio = null }
}
function beep(freq, dur, type, vol, slideTo) {
  if (!soundOn || !audio) return
  const t0 = audio.currentTime
  const o = audio.createOscillator(), g = audio.createGain()
  o.type = type
  o.frequency.setValueAtTime(freq, t0)
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur)
  g.gain.setValueAtTime(vol, t0)
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur)
  o.connect(g); g.connect(audio.destination)
  o.start(t0); o.stop(t0 + dur)
}

  const r = REGIONS[i]
  const band = RINGS[r.ring]
  const a = r.sector * SECTOR_SPAN + (Math.random() - 0.5) * SECTOR_SPAN * 0.88
  const rad = band.r0 + 40 + Math.random() * (band.r1 - band.r0 - 80)
  return {
    x: Math.max(50, Math.min(WORLD_W - 90, VILLAGE.x + Math.cos(a) * rad)),
    y: Math.max(50, Math.min(WORLD_H - 90, VILLAGE.y + Math.sin(a) * rad))
  }
}

function buildWorld() {
  for (let i = 0; i < REGIONS.length; i++) {
    const r = REGIONS[i]
    for (let n = 0; n < r.density; n++) {
      const p = pointInRegion(i)
      scenery.push({ kind: r.prop, x: p.x, y: p.y, r: 22 + Math.random() * 16, c: FLOWER_COLORS[Math.floor(Math.random() * FLOWER_COLORS.length)], n: 3 + Math.floor(Math.random() * 4), region: i })
    }
    for (let n = 0; n < 22; n++) {
      const p = pointInRegion(i)
      scenery.push({ kind: 'grass', x: p.x, y: p.y, r: 22 + Math.random() * 40 })
    }
    if (r.ring === 0) for (let n = 0; n < 3; n++) {
      const p = pointInRegion(i)
      scenery.push({ kind: 'pond', x: p.x, y: p.y, w: 54 + Math.random() * 60, h: 34 + Math.random() * 34 })
    }
  }
  for (let i = 0; i < 60; i++) {
    const a = Math.random() * Math.PI * 2
    const rad = Math.random() * (VILLAGE.r - 40)
    scenery.push({ kind: 'grass', x: VILLAGE.x + Math.cos(a) * rad, y: VILLAGE.y + Math.sin(a) * rad, r: 18 + Math.random() * 26 })
  }
  const spots = [[-1, -0.62], [1, -0.66], [-1.08, 0.5], [1.02, 0.46], [0, -0.95]]
  for (const s of spots) houses.push({ x: VILLAGE.x + s[0] * VILLAGE.r * 0.78, y: VILLAGE.y + s[1] * VILLAGE.r * 0.9, w: 92, h: 60 })
}
buildWorld()

function addFloat(x, y, text, color, size) {
  floatTexts.push({ x, y, text, color, size: size || 16, life: 50, maxLife: 50 })
}
function addRing(x, y, r, color, life) {
  rings.push({ x, y, r, life: life || 26, maxLife: life || 26, color })
}

function pickWander(e) {
  const a = Math.random() * Math.PI * 2
  const r = Math.random() * WANDER_RADIUS
  e.wanderX = e.homeX + Math.cos(a) * r
  e.wanderY = e.homeY + Math.sin(a) * r
  e.restTimer = 0
}

function makeEnemy(kind, x, y, region) {
  const t = ENEMY_TYPES[kind]
  const e = {
    kind, x, y, homeX: x, homeY: y,
    region: region === undefined ? -1 : region,
    size: t.size, speed: t.speed * (0.9 + Math.random() * 0.22),
    hp: t.hp, maxHp: t.hp, hitFlash: 0,
    state: 'idle', attackTime: -1, cooldown: 0,
    wanderX: x, wanderY: y, restTimer: 0,
    bob: Math.random() * 6,
    isBoss: !!t.boss
  }
  pickWander(e)
  enemies.push(e)
  return e
}

function spawnInRegion(i) {
  const p = pointInRegion(i)
  makeEnemy(REGIONS[i].kind, p.x, p.y, i)
}

function spawnAll() {
  for (let i = 0; i < REGIONS.length; i++) {
    for (let n = 0; n < REGIONS[i].count; n++) spawnInRegion(i)
    if (REGIONS[i].boss) spawnBoss(i)
  }
}

function spawnBoss(i) {
  const r = REGIONS[i]
  const band = RINGS[r.ring]
  const a = r.sector * SECTOR_SPAN
  const rad = band.r1 - 90
  makeEnemy(r.boss,
    Math.max(50, Math.min(WORLD_W - 90, VILLAGE.x + Math.cos(a) * rad)),
    Math.max(50, Math.min(WORLD_H - 90, VILLAGE.y + Math.sin(a) * rad)), i)
}

function spawnDummies() { for (const d of DUMMY_SPOTS) makeEnemy(d.kind, d.x, d.y) }

/* ---------- 의뢰 ---------- */
const QUEST_POOL = ['ant', 'rabbit', 'wasp', 'dog', 'cat', 'boar', 'toad', 'bandit', 'monk', 'wolf', 'fox', 'ghost']

function rollQuest() {
  const avail = QUEST_POOL.filter(k => ENEMY_TYPES[k].level <= Math.max(3, player.level + 6))
  const kind = avail[Math.floor(Math.random() * avail.length)] || 'ant'
  const t = ENEMY_TYPES[kind]
  quest.kind = kind
  quest.need = 5 + Math.floor(Math.random() * 8)
  quest.have = 0
  quest.gold = Math.round(t.exp * quest.need * 0.9) + 20
  quest.exp = Math.round(t.exp * quest.need * 0.8)
  quest.done = false
  saveGame()
}

function claimQuest() {
  if (!quest.kind || !quest.done) return
  player.gold += quest.gold
  addFloat(cx(player), player.y - 30, '+' + quest.gold + '냥', '#e8c46a', 18)
  gainExp(quest.exp)
  sfx.quest()
  rollQuest()
}

recalc(); player.hp = player.maxHp
loadGame()
if (!quest.kind) rollQuest()
spawnAll()
spawnDummies()
updateCamera()

/* ---------- 타겟 ---------- */
function pickTargetAt(sx, sy) {
  const px = sx + camera.x, py = sy + camera.y
  if (Math.hypot(px - cx(merchant), py - cy(merchant)) < TAP_PICK_RADIUS &&
      Math.hypot(cx(player) - cx(merchant), cy(player) - cy(merchant)) < TALK_RANGE) { shopOpen = true; return }
  if (Math.hypot(px - cx(board), py - cy(board)) < TAP_PICK_RADIUS &&
      Math.hypot(cx(player) - cx(board), cy(player) - cy(board)) < TALK_RANGE) { questOpen = true; return }
  for (const n of npcs) {
    if (Math.hypot(px - cx(n), py - cy(n)) > TAP_PICK_RADIUS) continue
    if (Math.hypot(cx(player) - cx(n), cy(player) - cy(n)) > TALK_RANGE + 30) continue
    n.talk = 220
    return
  }
  let found = null, bestDist = TAP_PICK_RADIUS
  for (const e of enemies) {
    const d = Math.hypot(px - cx(e), py - cy(e))
    if (d < bestDist) { bestDist = d; found = e }
  }
  if (found) { target = found; targetLocked = true } else targetLocked = false
}

function updateTarget() {
  if (target && !enemies.includes(target)) { target = null; targetLocked = false }
  if (targetLocked && target) {
    if (Math.hypot(cx(player) - cx(target), cy(player) - cy(target)) <= AUTO_TARGET_RANGE * 1.6) return
    targetLocked = false
  }
  let found = null, bestDist = AUTO_TARGET_RANGE
  for (const e of enemies) {
    const d = Math.hypot(cx(player) - cx(e), cy(player) - cy(e))
    if (d < bestDist) { bestDist = d; found = e }
  }
  target = found
}

function aimAtTarget() {
  if (!target || !enemies.includes(target)) return
  const dx = cx(target) - cx(player), dy = cy(target) - cy(player)
  const d = Math.hypot(dx, dy)
  if (d === 0) return
  player.faceX = dx / d; player.faceY = dy / d
}

function paused() { return gameOver || shopOpen || confirmReset || pickOptions || statusOpen || questOpen }
function busy() { return attack.time >= 0 || spin.time >= 0 || wind.time >= 0 || step.time >= 0 || dodge.time >= 0 }
function invulnerable() { return player.hurtTimer > 0 || dodge.time >= 0 || step.time >= 0 }

function inputVector() {
  let mx = 0, my = 0
  if (keys['KeyA']) mx -= 1
  if (keys['KeyD']) mx += 1
  if (keys['KeyW']) my -= 1
  if (keys['KeyS']) my += 1
  mx += joystick.dx; my += joystick.dy
  const len = Math.hypot(mx, my)
  if (len > 1) { mx /= len; my /= len }
  return { x: mx, y: my, len }
}

function startAttack() { ensureAudio(); if (paused() || busy() || attack.gap > 0) return; aimAtTarget(); attack.time = 0; comboTimer = COMBO_WINDOW; sfx.swing() }
function startSpin() { ensureAudio(); if (paused() || busy() || spin.cooldown > 0) return; aimAtTarget(); spin.time = 0; sfx.big() }
function startWind() { ensureAudio(); if (paused() || busy() || wind.cooldown > 0) return; aimAtTarget(); wind.time = 0; sfx.wind() }
function startStep() {
  ensureAudio()
  if (paused() || busy() || step.cooldown > 0) return
  if (!target || !enemies.includes(target)) { addFloat(cx(player), player.y - 20, '대상이 없소', '#e0b0a8', 14); return }
  const d = Math.hypot(cx(target) - cx(player), cy(target) - cy(player))
  if (d > STEP_RANGE) { addFloat(cx(player), player.y - 20, '너무 머오', '#e0b0a8', 14); return }
  aimAtTarget()
  step.tx = cx(target) - player.faceX * 52 - player.size / 2
  step.ty = cy(target) - player.faceY * 52 - player.size / 2
  step.time = 0
  sfx.step()
}
function startDodge() {
  ensureAudio()
  if (paused() || busy() || dodge.cooldown > 0) return
  const v = inputVector()
  if (v.len > 0.15) { const n = Math.hypot(v.x, v.y); dodge.dx = v.x / n; dodge.dy = v.y / n }
  else { dodge.dx = player.faceX; dodge.dy = player.faceY }
  dodge.time = 0; sfx.dodge()
}
function usePotion() {
  ensureAudio()
  if (paused() || player.potions <= 0 || player.hp >= player.maxHp) return
  player.potions -= 1
  player.hp = Math.min(player.maxHp, player.hp + POTION_HEAL)
  addFloat(cx(player), player.y - 6, '+' + POTION_HEAL, '#8fd08a', 18)
  addRing(cx(player), cy(player), 46, 'rgba(140, 210, 140, 0.7)')
  sfx.potion()
}

function spawnParticles(x, y, count, color, power) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2
    const s = power * (0.4 + Math.random() * 0.8)
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 20, maxLife: 20, size: 3 + Math.random() * 3, color })
  }
}

const keys = {}
document.addEventListener('keydown', (e) => {
  keys[e.code] = true
  if (e.code === 'Space') { gameOver ? revive() : startAttack() }
  if (e.code === 'KeyE') startSpin()
  if (e.code === 'KeyR') startWind()
  if (e.code === 'KeyF') startStep()
  if (e.code === 'KeyQ') usePotion()
  if (e.code === 'KeyC') statusOpen = !statusOpen
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') startDodge()
})
document.addEventListener('keyup', (e) => { keys[e.code] = false })
window.addEventListener('blur', () => { for (const c in keys) keys[c] = false })

const JOY_RADIUS = 60
const joystick = { touchId: null, baseX: 0, baseY: 0, dx: 0, dy: 0, startTime: 0, curX: 0, curY: 0 }

const BUTTON_RADIUS = 40
const HIT_RADIUS = 50
function attackBtn() { return { x: canvas.width - 74, y: canvas.height - 80 } }
function dodgeBtn() { return { x: canvas.width - 166, y: canvas.height - 80 } }
function spinBtn() { return { x: canvas.width - 74, y: canvas.height - 172 } }
function windBtn() { return { x: canvas.width - 166, y: canvas.height - 172 } }
function stepBtn() { return { x: canvas.width - 74, y: canvas.height - 264 } }
function potionBtn() { return { x: canvas.width - 166, y: canvas.height - 264 } }
function soundBtn() { return { x: canvas.width - 32, y: 150 } }
function resetBtn() { return { x: canvas.width - 32, y: 194 } }
function hudRect() { return { x: 14, y: 14, w: 252, h: 98 } }

function hitButton(p, btn, r) { return Math.hypot(p.x - btn.x, p.y - btn.y) < (r || HIT_RADIUS) }
function inRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h }

function centerPanel(w, h) {
  const pw = Math.min(canvas.width - 32, w)
  const ph = Math.min(canvas.height - 40, h)
  return { x: (canvas.width - pw) / 2, y: (canvas.height - ph) / 2, w: pw, h: ph }
}
function shopPanel() { return centerPanel(400, 400) }
function shopRow(i) { const p = shopPanel(); return { x: p.x + 16, y: p.y + 60 + i * 62, w: p.w - 32, h: 54 } }
function confirmPanel() { return centerPanel(320, 168) }
function confirmYes() { const p = confirmPanel(); return { x: p.x + 20, y: p.y + p.h - 62, w: (p.w - 52) / 2, h: 46 } }
function confirmNo() { const p = confirmPanel(); return { x: p.x + p.w / 2 + 6, y: p.y + p.h - 62, w: (p.w - 52) / 2, h: 46 } }
function pickPanel() { return centerPanel(400, 100 + (pickOptions ? pickOptions.length : 2) * 80) }
function pickRow(i) { const p = pickPanel(); return { x: p.x + 16, y: p.y + 76 + i * 80, w: p.w - 32, h: 70 } }
function statusPanel() { return centerPanel(376, 486) }
function statPlusRect(i) { const p = statusPanel(); return { x: p.x + p.w - 58, y: p.y + 146 + i * 34, w: 34, h: 28 } }
function questPanel() { return centerPanel(360, 260) }
function questBtnRect() { const p = questPanel(); return { x: p.x + 24, y: p.y + p.h - 66, w: p.w - 48, h: 46 } }

function shopItems() {
  const list = [
    { id: 'herb', name: '약초', desc: '체력 ' + POTION_HEAL + ' 회복', price: 25 },
    { id: 'atk', name: '단련', desc: '공격력 +1', price: 40 + player.atkUps * 30 },
    { id: 'hp', name: '보신', desc: '최대 체력 +8', price: 35 + player.hpUps * 25 }
  ]
  if (player.weapon < WEAPONS.length - 1) {
    const w = WEAPONS[player.weapon + 1]
    list.push({ id: 'weapon', name: w.name, desc: '무기 교체 · 공격력 +' + (w.atk - weapon().atk), price: w.price })
  }
  return list
}

function buy(item) {
  if (player.gold < item.price) { addFloat(cx(player), player.y - 20, '엽전이 모자라오', '#e08a86', 15); return }
  player.gold -= item.price
  if (item.id === 'herb') player.potions += 1
  if (item.id === 'atk') { player.atkBonus += 1; player.atkUps += 1 }
  if (item.id === 'hp') { player.hpBonus += 8; player.hpUps += 1 }
  if (item.id === 'weapon') { player.weapon += 1; addRing(cx(player), cy(player), 90, 'rgba(255, 226, 150, 0.9)', 34) }
  recalc()
  addFloat(cx(player), player.y - 20, item.name + ' 구입', '#f0d68a', 16)
  sfx.potion(); checkRealm(); saveGame()
}

function spendPoint(key) {
  if (player.points <= 0) return
  player.points -= 1
  player.stats[key] += 1
  recalc(); checkRealm(); saveGame()
}

function openJobPick() {
  if (player.jobTier === 0) {
    pickOptions = Object.keys(JOB_TREE).map(k => ({
      title: JOB_TREE[k].tiers[0], sub: JOB_TREE[k].label, desc: JOB_TREE[k].hint,
      gain: '공격 +' + JOB_TREE[k].atk[0] + '  체력 +' + JOB_TREE[k].hp[0] + '  속도 +' + JOB_TREE[k].spd[0],
      apply: () => { player.jobLine = k; advanceJob(1) }
    }))
  } else {
    const t = JOB_TREE[player.jobLine]
    pickOptions = t.fourth.map((f, i) => ({
      title: f.name, sub: t.label + ' 4차', desc: f.desc,
      gain: '공격 +' + f.atk + '  체력 +' + f.hp + '  속도 +' + f.spd,
      apply: () => { player.fourthIdx = i; advanceJob(4) }
    }))
  }
}

function advanceJob(tier) {
  const t = JOB_TREE[player.jobLine]
  player.jobTier = tier
  if (tier === 4) {
    const f = t.fourth[player.fourthIdx]
    player.atkBonus += f.atk; player.hpBonus += f.hp; player.spdBonus += f.spd
  } else {
    player.atkBonus += t.atk[tier - 1]; player.hpBonus += t.hp[tier - 1]; player.spdBonus += t.spd[tier - 1]
  }
  recalc(); player.hp = player.maxHp
  pickOptions = null
  addFloat(cx(player), player.y - 44, jobName() + ' 전직', '#ffd76a', 24)
  addRing(cx(player), cy(player), 130, 'rgba(255, 210, 130, 0.9)', 40)
  levelFx = Math.max(levelFx, 40)
  sfx.realm(); checkRealm(); saveGame()
}

function checkJobAdvance() {
  if (pickOptions) return
  if (player.jobTier === 0) { if (player.level >= JOB_LEVELS[0]) openJobPick(); return }
  if (player.jobTier === 3) { if (player.level >= JOB_LEVELS[3]) openJobPick(); return }
  if (player.jobTier < 3 && player.level >= JOB_LEVELS[player.jobTier]) advanceJob(player.jobTier + 1)
}

function checkRealm() {
  while (player.realm < REALMS.length - 1) {
    const next = REALMS[player.realm + 1]
    if (player.atk < next.atk || player.maxHp < next.hp || kills < next.kills) break
    player.realm += 1
    player.atkBonus += 2; player.hpBonus += 10
    recalc(); player.hp = player.maxHp
    addFloat(cx(player), player.y - 66, next.name + ' 경지', '#9ad8f0', 26)
    addRing(cx(player), cy(player), 170, 'rgba(150, 216, 240, 0.9)', 42)
    levelFx = Math.max(levelFx, 46)
    sfx.realm(); saveGame()
  }
}

function dummyExpGain() {
  if (player.level <= 1) return (player.expNext - player.exp) + Math.round(player.expNext * 1.28) + 8
  const h = player.level < DUMMY_HITS.length ? DUMMY_HITS[player.level] : 26
  return Math.max(1, Math.ceil(player.expNext / h))
}

function levelColor(lv) {
  const d = lv - player.level
  if (d >= 10) return '#ff7060'
  if (d >= 4) return '#ffab5c'
  if (d >= -3) return '#f6efd6'
  if (d >= -8) return '#a8d48c'
  return '#93a394'
}

/* ---------- 입력 ---------- */
canvas.addEventListener('mousedown', (e) => {
  ensureAudio()
  const p = toCanvas(e.clientX, e.clientY)
  if (handlePress(p)) return
  pickTargetAt(p.x, p.y)
})

function handlePress(p) {
  if (confirmReset) { if (inRect(p, confirmYes())) hardReset(); else confirmReset = false; return true }
  if (pickOptions) {
    for (let i = 0; i < pickOptions.length; i++) if (inRect(p, pickRow(i))) { pickOptions[i].apply(); return true }
    return true
  }
  if (questOpen) {
    if (inRect(p, questBtnRect())) { if (quest.done) claimQuest(); else rollQuest(); return true }
    if (!inRect(p, questPanel())) questOpen = false
    return true
  }
  if (statusOpen) {
    for (let i = 0; i < STAT_DEFS.length; i++) if (player.points > 0 && inRect(p, statPlusRect(i))) { spendPoint(STAT_DEFS[i].key); return true }
    if (!inRect(p, statusPanel())) statusOpen = false
    return true
  }
  if (gameOver) { revive(); return true }

  if (hitButton(p, soundBtn(), 24)) { soundOn = !soundOn; if (soundOn) ensureAudio(); return true }
  if (hitButton(p, resetBtn(), 24)) { confirmReset = true; return true }

  if (shopOpen) {
    const panel = shopPanel(), items = shopItems()
    for (let i = 0; i < items.length; i++) if (inRect(p, shopRow(i))) { buy(items[i]); return true }
    if (!inRect(p, panel) || Math.hypot(p.x - (panel.x + panel.w - 22), p.y - (panel.y + 22)) < 24) shopOpen = false
    return true
  }

  if (inRect(p, hudRect())) { statusOpen = true; return true }
  if (hitButton(p, attackBtn())) { startAttack(); return true }
  if (hitButton(p, dodgeBtn())) { startDodge(); return true }
  if (hitButton(p, spinBtn())) { startSpin(); return true }
  if (hitButton(p, windBtn())) { startWind(); return true }
  if (hitButton(p, stepBtn())) { startStep(); return true }
  if (hitButton(p, potionBtn())) { usePotion(); return true }
  return false
}

function aimJoystick(p) {
  let ox = p.x - joystick.baseX, oy = p.y - joystick.baseY
  const d = Math.hypot(ox, oy)
  if (d > JOY_RADIUS) { ox = (ox / d) * JOY_RADIUS; oy = (oy / d) * JOY_RADIUS }
  joystick.dx = ox / JOY_RADIUS; joystick.dy = oy / JOY_RADIUS
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault(); ensureAudio()
  for (const touch of e.changedTouches) {
    const p = toCanvas(touch.clientX, touch.clientY)
    if (handlePress(p)) continue
    if (joystick.touchId !== null) continue
    joystick.touchId = touch.identifier
    joystick.baseX = p.x; joystick.baseY = p.y
    joystick.curX = p.x; joystick.curY = p.y
    joystick.startTime = performance.now()
    joystick.dx = 0; joystick.dy = 0
  }
})
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault()
  for (const touch of e.changedTouches) {
    if (touch.identifier !== joystick.touchId) continue
    const p = toCanvas(touch.clientX, touch.clientY)
    joystick.curX = p.x; joystick.curY = p.y
    aimJoystick(p)
  }
})
function endTouch(e) {
  e.preventDefault()
  for (const touch of e.changedTouches) {
    if (touch.identifier !== joystick.touchId) continue
    const heldMs = performance.now() - joystick.startTime
    const moved = Math.hypot(joystick.curX - joystick.baseX, joystick.curY - joystick.baseY)
    if (heldMs < TAP_MAX_MS && moved < TAP_MAX_MOVE) pickTargetAt(joystick.baseX, joystick.baseY)
    joystick.touchId = null; joystick.dx = 0; joystick.dy = 0
  }
}
canvas.addEventListener('touchend', endTouch)
canvas.addEventListener('touchcancel', endTouch)

/* ---------- 전투 ---------- */
function isColliding(a, b) {
  return a.x < b.x + b.size && a.x + a.size > b.x && a.y < b.y + b.size && a.y + a.size > b.y
}

function attackBox() {
  const ax = cx(player) + player.faceX * ATTACK_REACH
  const ay = cy(player) + player.faceY * ATTACK_REACH
  return { x: ax - ATTACK_SIZE / 2, y: ay - ATTACK_SIZE / 2, size: ATTACK_SIZE }
}

function findTarget() {
  const box = attackBox()
  if (target && enemies.includes(target)) return isColliding(box, target) ? target : null
  let found = null, bestDist = Infinity
  for (const e of enemies) {
    if (!isColliding(box, e)) continue
    const d = Math.hypot(cx(player) - cx(e), cy(player) - cy(e))
    if (d < bestDist) { bestDist = d; found = e }
  }
  return found
}

function hurtPlayer(amount) {
  player.hp -= amount
  player.hurtTimer = HURT_INVULN
  player.combatTimer = REGEN_DELAY
  combo = 0; hitStop = 5; shake = 7; hurtFlash = 26
  addFloat(cx(player), player.y - 4, '-' + amount, '#e08a86', 17)
  spawnParticles(cx(player), cy(player), 8, '#c04a52', 4)
  sfx.hurt()
  if (player.hp <= 0) { player.hp = 0; gameOver = true; shake = 14; saveBest() }
}

function gainExp(amount) {
  if (player.level >= MAX_LEVEL) { player.exp = 0; return }
  player.exp += amount
  while (player.exp >= player.expNext && player.level < MAX_LEVEL) {
    player.exp -= player.expNext
    player.level += 1
    player.expNext = Math.round(player.expNext * 1.28) + 8
    player.points += POINTS_PER_LEVEL
    player.hp = player.maxHp
    levelFx = 50; shake = 5; levelBanner = 90; bannerText = player.level + '단'
    addFloat(cx(player), player.y - 34, player.level + '단', '#ffe6a0', 24)
    addRing(cx(player), cy(player), 90, 'rgba(255, 226, 150, 0.95)', 34)
    addRing(cx(player), cy(player), 150, 'rgba(255, 200, 110, 0.6)', 44)
    spawnParticles(cx(player), cy(player), 26, '#ffd870', 6)
    sfx.level()
  }
  if (player.level >= MAX_LEVEL) player.exp = 0
  checkJobAdvance(); checkRealm(); saveGame()
}

function dropLoot(e) {
  const t = ENEMY_TYPES[e.kind]
  const base = Math.max(2, Math.round(t.exp * 0.5))
  const r = Math.random()
  if (r < 0.55) drops.push({ kind: 'gold', x: cx(e), y: cy(e), bob: Math.random() * 6, amount: base + Math.floor(Math.random() * base) })
  else if (r < 0.72) drops.push({ kind: 'herb', x: cx(e), y: cy(e), bob: Math.random() * 6 })
}

function killEnemy(e) {
  const t = ENEMY_TYPES[e.kind]
  spawnParticles(cx(e), cy(e), 16, t.body, 7)
  dropLoot(e)
  kills += 1
  killCount[e.kind] = (killCount[e.kind] || 0) + 1

  if (quest.kind === e.kind && !quest.done) {
    quest.have += 1
    if (quest.have >= quest.need) { quest.done = true; addFloat(cx(player), player.y - 48, '의뢰 완료', '#9ad8f0', 20); sfx.quest() }
  }

  gainExp(t.exp * EXP_MULT)
  addFloat(cx(e), e.y - 14, '+' + (t.exp * EXP_MULT), '#a8c8e8', 14)
  enemies.splice(enemies.indexOf(e), 1)
  if (target === e) { target = null; targetLocked = false }
  sfx.kill()

  if (e.isBoss) {
    for (let i = 0; i < 5; i++) drops.push({ kind: 'gold', x: cx(e) + (Math.random() - 0.5) * 80, y: cy(e) + (Math.random() - 0.5) * 80, bob: Math.random() * 6, amount: Math.round(t.exp * 0.35) })
    addRing(cx(e), cy(e), 180, 'rgba(240, 180, 120, 0.9)', 44)
    shake = 16
    respawnTimers.push({ t: BOSS_RESPAWN, region: e.region, boss: true })
  } else {
    respawnTimers.push({ t: RESPAWN_DELAY, region: e.region })
  }
}

function damageEnemy(e, amount, strong) {
  const t = ENEMY_TYPES[e.kind]
  if (t.isDummy) {
    e.hitFlash = 7
    player.combatTimer = REGEN_DELAY
    let gain = dummyExpGain()
    if (e.kind === 'redDummy') gain *= 1000
    else if (player.level >= DUMMY_MAX_LEVEL) gain = 0
    if (gain > 0) { addFloat(cx(e), e.y - 8, '+' + gain, '#a8c8e8', strong ? 20 : 16); gainExp(gain) }
    else addFloat(cx(e), e.y - 8, '십단부터는 밖으로', '#d8c8a8', 13)
    spawnParticles(cx(e), cy(e), strong ? 10 : 6, '#f0e0b4', strong ? 6 : 4)
    if (strong) sfx.big(); else sfx.hit()
    return
  }
  e.hp -= amount
  e.hitFlash = 7
  e.state = 'chase'
  player.combatTimer = REGEN_DELAY
  addFloat(cx(e), e.y - 8, String(amount), strong ? '#ffd76a' : '#fff2cc', strong ? 24 : 17)
  spawnParticles(cx(e), cy(e), strong ? 14 : 8, '#f0e0b4', strong ? 7 : 5)
  if (strong) sfx.big(); else sfx.hit()
  if (e.hp <= 0) killEnemy(e)
}

function hardReset() {
  try { localStorage.removeItem('palhyeop_save') } catch (err) {}
  player.stats = { str: 0, con: 0, agi: 0, spi: 0 }
  player.points = 0
  player.atkBonus = 0; player.hpBonus = 0; player.spdBonus = 0
  player.level = 0; player.exp = 0; player.expNext = 30
  player.gold = 0; player.potions = 1
  player.atkUps = 0; player.hpUps = 0; player.weapon = 0
  player.jobLine = null; player.jobTier = 0; player.fourthIdx = -1
  player.realm = 0
  recalc(); player.hp = player.maxHp
  player.x = VILLAGE.x; player.y = VILLAGE.y + 130
  player.hurtTimer = 0; player.combatTimer = 0

  kills = 0; combo = 0; comboTimer = 0
  for (const k in killCount) delete killCount[k]
  gameOver = false; shopOpen = false; confirmReset = false
  pickOptions = null; statusOpen = false; questOpen = false; levelFx = 0
  target = null; targetLocked = false; currentRegion = -2
  attack.time = -1; attack.gap = 0
  spin.time = -1; spin.cooldown = 0
  wind.time = -1; wind.cooldown = 0
  step.time = -1; step.cooldown = 0
  dodge.time = -1; dodge.cooldown = 0

  enemies.length = 0; respawnTimers.length = 0; projectiles.length = 0
  drops.length = 0; particles.length = 0
  floatTexts.length = 0; afterimages.length = 0

  rollQuest()
  spawnAll(); spawnDummies()
  updateCamera(); saveGame()
  addFloat(cx(player), player.y - 24, '처음부터', '#f0d68a', 18)
}

function revive() {
  lostGold = Math.floor(player.gold * 0.3)
  player.gold -= lostGold
  player.hp = player.maxHp
  player.x = VILLAGE.x; player.y = VILLAGE.y + 130
  player.hurtTimer = HURT_INVULN * 2
  player.combatTimer = 0
  shopOpen = false; targetLocked = false; target = null
  attack.time = -1; attack.gap = 0
  spin.time = -1; wind.time = -1; step.time = -1; dodge.time = -1
  combo = 0; comboTimer = 0
  gameOver = false; currentRegion = -2
  drops.length = 0; particles.length = 0
  floatTexts.length = 0; afterimages.length = 0; projectiles.length = 0
  for (const e of enemies) { e.state = 'idle'; e.attackTime = -1; e.x = e.homeX; e.y = e.homeY }
  saveGame()
  addFloat(cx(player), player.y - 24, '엽전 ' + lostGold + '냥을 잃었다', '#e08a86', 15)
}

function updateEffects() {
  if (levelFx > 0) levelFx -= 1
  if (hurtFlash > 0) hurtFlash -= 1
  if (levelBanner > 0) levelBanner -= 1
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]
    p.x += p.vx; p.y += p.vy; p.vx *= 0.9; p.vy *= 0.9
    if (--p.life <= 0) particles.splice(i, 1)
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    floatTexts[i].y -= 0.75
    if (--floatTexts[i].life <= 0) floatTexts.splice(i, 1)
  }
  for (let i = rings.length - 1; i >= 0; i--) if (--rings[i].life <= 0) rings.splice(i, 1)
  for (let i = afterimages.length - 1; i >= 0; i--) if (--afterimages[i].life <= 0) afterimages.splice(i, 1)
  for (let i = respawnTimers.length - 1; i >= 0; i--) {
    if (--respawnTimers[i].t <= 0) {
      const r = respawnTimers[i]
      respawnTimers.splice(i, 1)
      if (r.boss) spawnBoss(r.region >= 0 ? r.region : 0)
      else spawnInRegion(r.region >= 0 ? r.region : 0)
    }
  }
  if (zoneBanner > 0) zoneBanner -= 1
  if (merchant.talk > 0) merchant.talk -= 1
  for (const n of npcs) if (n.talk > 0) n.talk -= 1
}

function updateProjectiles() {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const pr = projectiles[i]
    pr.x += pr.vx; pr.y += pr.vy
    pr.life -= 1
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j]
      if (pr.hit.includes(e)) continue
      if (Math.hypot(pr.x - cx(e), pr.y - cy(e)) > e.size * 0.7 + 14) continue
      pr.hit.push(e)
      damageEnemy(e, pr.dmg, false)
      hitStop = 3; shake = 4
      if (pr.hit.length >= 3) { pr.life = 0; break }
    }
    if (pr.life <= 0) projectiles.splice(i, 1)
  }
}

function updateDrops() {
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i]
    d.bob += 0.09
    if (Math.hypot(cx(player) - d.x, cy(player) - d.y) > PICKUP_RANGE) continue
    if (d.kind === 'gold') { player.gold += d.amount; addFloat(d.x, d.y - 8, '+' + d.amount + '냥', '#e8c46a', 15) }
    else { player.potions += 1; addFloat(d.x, d.y - 8, '약초 +1', '#8fd08a', 15) }
    sfx.pickup()
    drops.splice(i, 1)
  }
}

function moveToward(e, tx, ty, speed) {
  const dx = tx - e.x, dy = ty - e.y
  const d = Math.hypot(dx, dy)
  if (d < speed) { e.x = tx; e.y = ty; return 0 }
  e.x += (dx / d) * speed; e.y += (dy / d) * speed
  return d
}

function updateEnemy(e) {
  const t = ENEMY_TYPES[e.kind]
  if (e.hitFlash > 0) e.hitFlash -= 1
  e.bob += 0.05
  if (t.isDummy) return
  if (e.cooldown > 0) e.cooldown -= 1

  if (e.attackTime >= 0) {
    if (e.attackTime === ENEMY_WINDUP) {
      const d = Math.hypot(cx(player) - cx(e), cy(player) - cy(e))
      if (d <= t.range + 14 && !invulnerable()) hurtPlayer(t.dmg)
    }
    e.attackTime += 1
    if (e.attackTime >= ENEMY_WINDUP + ENEMY_RECOVER) { e.attackTime = -1; e.cooldown = ENEMY_COOLDOWN }
    return
  }

  const dp = Math.hypot(cx(player) - cx(e), cy(player) - cy(e))
  const dh = Math.hypot(e.homeX - e.x, e.homeY - e.y)
  const inVillage = Math.hypot(cx(player) - VILLAGE.x, cy(player) - VILLAGE.y) < VILLAGE.r

  if (e.state === 'chase' && (dh > LEASH_RANGE || dp > AGGRO_RANGE * 2 || inVillage)) e.state = 'return'
  if (e.state === 'return' && dh < 6) { e.state = 'idle'; pickWander(e) }
  if (e.state === 'idle' && !t.passive && !inVillage && dp < AGGRO_RANGE) e.state = 'chase'

  if (e.state === 'return') { moveToward(e, e.homeX, e.homeY, e.speed); return }
  if (e.state === 'idle') {
    if (e.restTimer > 0) { e.restTimer -= 1; return }
    if (moveToward(e, e.wanderX, e.wanderY, e.speed * 0.4) === 0) { e.restTimer = 60 + Math.random() * 180; pickWander(e) }
    return
  }
  if (dp > t.range) moveToward(e, player.x, player.y, e.speed)
  else if (e.cooldown <= 0) e.attackTime = 0
}

function separateEnemies() {
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]
    if (ENEMY_TYPES[a.kind].isDummy) continue
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j]
      if (ENEMY_TYPES[b.kind].isDummy) continue
      let ddx = cx(b) - cx(a), ddy = cy(b) - cy(a)
      if (Math.abs(ddx) > MIN_DIST || Math.abs(ddy) > MIN_DIST) continue
      let d = Math.hypot(ddx, ddy)
      if (d > MIN_DIST) continue
      if (d === 0) { ddx = 1; d = 1 }
      const push = (MIN_DIST - d) / 2
      a.x -= (ddx / d) * push; a.y -= (ddy / d) * push
      b.x += (ddx / d) * push; b.y += (ddy / d) * push
    }
  }
}

function update() {
  updateEffects()
  if (paused()) { if (shake > 0) shake *= 0.8; return }

  if (player.hurtTimer > 0) player.hurtTimer -= 1
  if (player.combatTimer > 0) player.combatTimer -= 1
  if (spin.cooldown > 0) spin.cooldown -= 1
  if (wind.cooldown > 0) wind.cooldown -= 1
  if (step.cooldown > 0) step.cooldown -= 1
  if (dodge.cooldown > 0) dodge.cooldown -= 1
  if (attack.gap > 0) attack.gap -= 1
  if (comboTimer > 0) { comboTimer -= 1; if (comboTimer === 0) combo = 0 }
  if (shake > 0) shake *= 0.8

  if (player.combatTimer <= 0 && player.hp < player.maxHp) {
    player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.001)
  }

  updateDrops()
  updateProjectiles()

  const inVillage = Math.hypot(cx(player) - VILLAGE.x, cy(player) - VILLAGE.y) < VILLAGE.r
  const reg = inVillage ? -1 : regionIndexAt(cx(player), cy(player))
  if (reg !== currentRegion) { currentRegion = reg; zoneBanner = 130 }

  const v = inputVector()
  let mx = v.x, my = v.y

  if (step.time >= 0) {
    const t = step.time / (STEP_WINDUP + STEP_RECOVER)
    if (step.time === STEP_WINDUP) {
      player.x = Math.max(0, Math.min(WORLD_W - player.size, step.tx))
      player.y = Math.max(0, Math.min(WORLD_H - player.size, step.ty))
      afterimages.push({ x: player.x, y: player.y, size: player.size, life: 14, maxLife: 14 })
      if (target && enemies.includes(target)) {
        damageEnemy(target, Math.round(player.atk * 2.1), true)
        hitStop = 9; shake = 9
        addRing(cx(player), cy(player), 70, 'rgba(180, 200, 255, 0.9)', 26)
      }
    }
    step.time += 1
    if (step.time >= STEP_WINDUP + STEP_RECOVER) { step.time = -1; step.cooldown = stepCd() }
    mx = 0; my = 0
  } else if (dodge.time >= 0) {
    const t = dodge.time / DODGE_TIME
    const sp = DODGE_SPEED * (1 - t * 0.55)
    player.x += dodge.dx * sp; player.y += dodge.dy * sp
    if (dodge.time % 3 === 0) afterimages.push({ x: player.x, y: player.y, size: player.size, life: 12, maxLife: 12 })
    dodge.time += 1
    if (dodge.time >= DODGE_TIME) { dodge.time = -1; dodge.cooldown = DODGE_COOLDOWN }
    mx = 0; my = 0
  } else if (busy()) {
    mx = 0; my = 0
  } else if (v.len > 0) {
    const n = Math.hypot(v.x, v.y)
    player.faceX = v.x / n; player.faceY = v.y / n
  }

  player.x = Math.max(0, Math.min(WORLD_W - player.size, player.x + mx * player.speed))
  player.y = Math.max(0, Math.min(WORLD_H - player.size, player.y + my * player.speed))

  for (const e of enemies) updateEnemy(e)
  separateEnemies()
  updateTarget()

  for (const e of enemies) {
    if (ENEMY_TYPES[e.kind].isDummy) continue
    const dx = cx(player) - cx(e), dy = cy(player) - cy(e)
    const d = Math.hypot(dx, dy)
    if (d > 0 && d < MIN_DIST) { e.x = player.x - (dx / d) * MIN_DIST; e.y = player.y - (dy / d) * MIN_DIST }
    const vx = cx(e) - VILLAGE.x, vy = cy(e) - VILLAGE.y
    const vd = Math.hypot(vx, vy)
    if (vd < VILLAGE.r && vd > 0) {
      e.x = VILLAGE.x + (vx / vd) * VILLAGE.r - e.size / 2
      e.y = VILLAGE.y + (vy / vd) * VILLAGE.r - e.size / 2
    }
    e.x = Math.max(0, Math.min(WORLD_W - e.size, e.x))
    e.y = Math.max(0, Math.min(WORLD_H - e.size, e.y))
  }

  if (attack.time >= 0) {
    if (attack.time < ATTACK_WINDUP) aimAtTarget()
    if (attack.time === ATTACK_WINDUP) {
      const hit = findTarget()
      if (hit) {
        combo += 1; comboTimer = COMBO_WINDOW
        const strong = combo % 3 === 0
        hitStop = strong ? 9 : 4; shake = strong ? 8 : 4
        damageEnemy(hit, Math.round(player.atk * (strong ? 2.2 : 1)), strong)
      }
    }
    attack.time += 1
    if (attack.time >= ATTACK_WINDUP + ATTACK_RECOVER) { attack.time = -1; attack.gap = ATTACK_GAP }
  }

  if (spin.time >= 0) {
    if (spin.time === SPIN_WINDUP) {
      let any = false
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i]
        if (Math.hypot(cx(player) - cx(e), cy(player) - cy(e)) > SPIN_RADIUS) continue
        damageEnemy(e, Math.round(player.atk * spinMult()), false)
        any = true
      }
      hitStop = any ? 9 : 3; shake = any ? 8 : 3
      addRing(cx(player), cy(player), SPIN_RADIUS, 'rgba(240, 200, 120, 0.8)')
    }
    spin.time += 1
    if (spin.time >= SPIN_WINDUP + SPIN_RECOVER) { spin.time = -1; spin.cooldown = spinCd() }
  }

  if (wind.time >= 0) {
    if (wind.time === WIND_WINDUP) {
      projectiles.push({
        x: cx(player) + player.faceX * 30, y: cy(player) + player.faceY * 30,
        vx: player.faceX * 11, vy: player.faceY * 11,
        dmg: Math.round(player.atk * 1.35), life: 42, hit: [],
        angle: Math.atan2(player.faceY, player.faceX)
      })
      shake = 3
    }
    wind.time += 1
    if (wind.time >= WIND_WINDUP + WIND_RECOVER) { wind.time = -1; wind.cooldown = windCd() }
  }

  updateCamera()
}

/* ---------- 그리기 ---------- */
function visible(x, y, pad) {
  const m = pad || 90
  return x > camera.x - m && x < camera.x + canvas.width + m &&
         y > camera.y - m && y < camera.y + canvas.height + m
}

function drawShadow(x, y, r) {
  ctx.fillStyle = 'rgba(40, 50, 30, 0.24)'
  ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.36, 0, 0, Math.PI * 2); ctx.fill()
}

function outlineText(text, x, y, color, font) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'
  ctx.font = font
  ctx.lineWidth = 3.5
  ctx.strokeStyle = 'rgba(28, 32, 22, 0.85)'
  ctx.strokeText(text, x, y)
  ctx.fillStyle = color
  ctx.fillText(text, x, y)
}

function drawGround() {
  ctx.fillStyle = '#4a5a3a'
  ctx.fillRect(camera.x, camera.y, canvas.width, canvas.height)

  for (const r of REGIONS) {
    const band = RINGS[r.ring]
    const a0 = r.sector * SECTOR_SPAN - SECTOR_SPAN / 2
    ctx.fillStyle = r.tint
    ctx.beginPath()
    ctx.arc(VILLAGE.x, VILLAGE.y, band.r1, a0, a0 + SECTOR_SPAN)
    ctx.arc(VILLAGE.x, VILLAGE.y, band.r0, a0 + SECTOR_SPAN, a0, true)
    ctx.closePath(); ctx.fill()
  }

  ctx.strokeStyle = 'rgba(160, 140, 100, 0.14)'
  ctx.lineWidth = 3
  ctx.setLineDash([18, 14])
  for (let s = 0; s < SECTOR_COUNT; s++) {
    const a = s * SECTOR_SPAN - SECTOR_SPAN / 2
    ctx.beginPath()
    ctx.moveTo(VILLAGE.x + Math.cos(a) * VILLAGE.r, VILLAGE.y + Math.sin(a) * VILLAGE.r)
    ctx.lineTo(VILLAGE.x + Math.cos(a) * RINGS[1].r1, VILLAGE.y + Math.sin(a) * RINGS[1].r1)
    ctx.stroke()
  }
  ctx.beginPath(); ctx.arc(VILLAGE.x, VILLAGE.y, RINGS[0].r1, 0, Math.PI * 2); ctx.stroke()
  ctx.setLineDash([])

  for (const s of scenery) {
    if (!visible(s.x, s.y)) continue
    if (s.kind === 'grass') {
      ctx.fillStyle = 'rgba(146, 172, 96, 0.24)'
      ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r, s.r * 0.62, 0, 0, Math.PI * 2); ctx.fill()
    } else if (s.kind === 'pond') {
      ctx.fillStyle = 'rgba(96, 150, 168, 0.55)'
      ctx.beginPath(); ctx.ellipse(s.x, s.y, s.w, s.h, 0, 0, Math.PI * 2); ctx.fill()
      ctx.fillStyle = 'rgba(150, 200, 214, 0.4)'
      ctx.beginPath(); ctx.ellipse(s.x - s.w * 0.2, s.y - s.h * 0.25, s.w * 0.45, s.h * 0.32, 0, 0, Math.PI * 2); ctx.fill()
    } else if (s.kind === 'flower') {
      for (let i = 0; i < s.n; i++) {
        const fx = s.x + Math.cos(i * 2.4) * (7 + i * 4)
        const fy = s.y + Math.sin(i * 2.4) * (5 + i * 3)
        ctx.fillStyle = 'rgba(110, 148, 78, 0.7)'
        ctx.fillRect(fx - 1, fy, 2, 7)
        ctx.fillStyle = s.c
        ctx.beginPath(); ctx.arc(fx, fy, 3.4, 0, Math.PI * 2); ctx.fill()
      }
    } else if (s.kind === 'rock') {
      drawShadow(s.x, s.y + s.r * 0.4, s.r * 0.8)
      ctx.fillStyle = '#8a8878'
      ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r * 0.7, s.r * 0.55, 0, 0, Math.PI * 2); ctx.fill()
      ctx.fillStyle = '#a5a392'
      ctx.beginPath(); ctx.ellipse(s.x - s.r * 0.15, s.y - s.r * 0.18, s.r * 0.36, s.r * 0.24, 0, 0, Math.PI * 2); ctx.fill()
    } else if (s.kind === 'reed') {
      ctx.strokeStyle = '#7f8f56'
      ctx.lineWidth = 2
      for (let i = 0; i < 5; i++) {
        const bx = s.x + (i - 2) * 6
        ctx.beginPath(); ctx.moveTo(bx, s.y); ctx.quadraticCurveTo(bx + 4, s.y - 20, bx + 2, s.y - 34); ctx.stroke()
      }
      ctx.fillStyle = '#6b5a3a'
      for (let i = 0; i < 5; i++) ctx.fillRect(s.x + (i - 2) * 6, s.y - 40, 3, 8)
    }
  }

  ctx.fillStyle = 'rgba(196, 172, 120, 0.55)'
  ctx.beginPath(); ctx.arc(VILLAGE.x, VILLAGE.y, VILLAGE.r, 0, Math.PI * 2); ctx.fill()
  ctx.strokeStyle = 'rgba(226, 202, 150, 0.5)'
  ctx.lineWidth = 5
  ctx.beginPath(); ctx.arc(VILLAGE.x, VILLAGE.y, VILLAGE.r, 0, Math.PI * 2); ctx.stroke()

  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2
    const px = VILLAGE.x + Math.cos(a) * VILLAGE.r
    const py = VILLAGE.y + Math.sin(a) * VILLAGE.r
    if (!visible(px, py)) continue
    drawShadow(px, py + 6, 8)
    ctx.fillStyle = '#7a5f3c'
    ctx.fillRect(px - 4, py - 24, 8, 28)
    ctx.fillStyle = PAL.gold
    ctx.beginPath(); ctx.arc(px, py - 28, 7, 0, Math.PI * 2); ctx.fill()
    ctx.fillStyle = 'rgba(255, 224, 150, 0.26)'
    ctx.beginPath(); ctx.arc(px, py - 28, 16, 0, Math.PI * 2); ctx.fill()
  }

  ctx.strokeStyle = 'rgba(120, 140, 90, 0.5)'
  ctx.lineWidth = 6
  ctx.strokeRect(0, 0, WORLD_W, WORLD_H)
}

function drawProp(s) {
  if (s.kind === 'tree') {
    drawShadow(s.x, s.y + 4, s.r * 0.85)
    ctx.fillStyle = '#7a5c38'; ctx.fillRect(s.x - 5, s.y - s.r * 0.7, 10, s.r * 0.7)
    ctx.fillStyle = '#4e7a3e'; ctx.beginPath(); ctx.arc(s.x, s.y - s.r * 0.95, s.r, 0, Math.PI * 2); ctx.fill()
    ctx.fillStyle = '#5e8f4a'; ctx.beginPath(); ctx.arc(s.x - s.r * 0.3, s.y - s.r * 1.15, s.r * 0.62, 0, Math.PI * 2); ctx.fill()
    ctx.fillStyle = '#72a758'; ctx.beginPath(); ctx.arc(s.x + s.r * 0.28, s.y - s.r * 1.3, s.r * 0.44, 0, Math.PI * 2); ctx.fill()
  } else if (s.kind === 'bamboo') {
    drawShadow(s.x, s.y + 3, 12)
    for (let i = 0; i < 3; i++) {
      const bx = s.x + (i - 1) * 11
      const h = s.r * 2.6 - Math.abs(i - 1) * 14
      ctx.fillStyle = i === 1 ? '#8bbf62' : '#79a955'
      ctx.fillRect(bx - 4, s.y - h, 8, h)
      ctx.fillStyle = 'rgba(50, 70, 40, 0.3)'
      for (let k = 1; k < 4; k++) ctx.fillRect(bx - 4, s.y - h * k / 4, 8, 2)
    }
    ctx.fillStyle = '#95cf6e'
    ctx.beginPath(); ctx.ellipse(s.x, s.y - s.r * 2.5, 20, 8, -0.4, 0, Math.PI * 2); ctx.fill()
  } else if (s.kind === 'pine') {
    drawShadow(s.x, s.y + 4, s.r * 0.7)
    ctx.fillStyle = '#6b573a'; ctx.fillRect(s.x - 4, s.y - s.r * 0.5, 8, s.r * 0.5)
    for (let i = 0; i < 3; i++) {
      const w = s.r * (1 - i * 0.22), yy = s.y - s.r * (0.5 + i * 0.55)
      ctx.fillStyle = i === 2 ? '#e8f0f6' : '#3f6a52'
      ctx.beginPath(); ctx.moveTo(s.x - w, yy); ctx.lineTo(s.x, yy - s.r * 0.8); ctx.lineTo(s.x + w, yy); ctx.closePath(); ctx.fill()
    }
  } else if (s.kind === 'dead') {
    drawShadow(s.x, s.y + 3, s.r * 0.5)
    ctx.strokeStyle = '#4a3a30'; ctx.lineWidth = 5
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y - s.r * 1.4); ctx.stroke()
    ctx.lineWidth = 3
    ctx.beginPath(); ctx.moveTo(s.x, s.y - s.r); ctx.lineTo(s.x - s.r * 0.6, s.y - s.r * 1.5); ctx.stroke()
    ctx.beginPath(); ctx.moveTo(s.x, s.y - s.r * 1.15); ctx.lineTo(s.x + s.r * 0.55, s.y - s.r * 1.6); ctx.stroke()
  } else if (s.kind === 'grave') {
    drawShadow(s.x, s.y + 4, 16)
    ctx.fillStyle = '#8f8c84'
    ctx.beginPath(); ctx.roundRect(s.x - 12, s.y - 34, 24, 34, 10); ctx.fill()
    ctx.fillStyle = 'rgba(60, 60, 55, 0.45)'
    ctx.fillRect(s.x - 7, s.y - 24, 14, 3)
    ctx.fillRect(s.x - 7, s.y - 17, 14, 3)
  } else {
    drawProp({ ...s, kind: 'tree' })
  }
}

function drawHouse(h) {
  drawShadow(h.x, h.y + h.h * 0.5 + 4, h.w * 0.5)
  ctx.fillStyle = '#d8c39a'; ctx.fillRect(h.x - h.w / 2, h.y - h.h / 2, h.w, h.h)
  ctx.fillStyle = '#a8845c'; ctx.fillRect(h.x - h.w / 2, h.y - h.h / 2, h.w, 6)
  ctx.fillStyle = '#6b5236'
  ctx.beginPath()
  ctx.moveTo(h.x - h.w / 2 - 12, h.y - h.h / 2)
  ctx.lineTo(h.x, h.y - h.h / 2 - 34)
  ctx.lineTo(h.x + h.w / 2 + 12, h.y - h.h / 2)
  ctx.closePath(); ctx.fill()
  ctx.fillStyle = PAL.navy
  ctx.fillRect(h.x - 12, h.y - 4, 24, h.h / 2 + 4)
}

function drawToken(x, y, size, body, top, shape, bob) {
  const lift = Math.sin(bob || 0) * 1.5
  drawShadow(x + size / 2, y + size + 3, size * 0.5)
  const yy = y + lift

  if (shape === 'spirit') {
    ctx.globalAlpha = 0.82
    ctx.fillStyle = body
    ctx.beginPath()
    ctx.moveTo(x, yy + size)
    ctx.quadraticCurveTo(x + size * 0.5, yy + size * 1.18, x + size, yy + size)
    ctx.lineTo(x + size, yy + size * 0.4)
    ctx.arc(x + size / 2, yy + size * 0.4, size / 2, 0, Math.PI, true)
    ctx.closePath(); ctx.fill()
    ctx.fillStyle = top
    ctx.beginPath(); ctx.ellipse(x + size / 2, yy + size * 0.34, size * 0.34, size * 0.2, 0, 0, Math.PI * 2); ctx.fill()
    ctx.globalAlpha = 1
    return
  }

  if (shape === 'bug') {
    ctx.strokeStyle = body; ctx.lineWidth = 2
    ctx.beginPath(); ctx.moveTo(x + size * 0.32, yy + 4); ctx.lineTo(x + size * 0.18, yy - 9); ctx.stroke()
    ctx.beginPath(); ctx.moveTo(x + size * 0.68, yy + 4); ctx.lineTo(x + size * 0.82, yy - 9); ctx.stroke()
  }
  if (shape === 'beast') {
    ctx.fillStyle = body
    ctx.beginPath(); ctx.moveTo(x + 4, yy + 8); ctx.lineTo(x + 2, yy - 9); ctx.lineTo(x + size * 0.38, yy + 2); ctx.closePath(); ctx.fill()
    ctx.beginPath(); ctx.moveTo(x + size - 4, yy + 8); ctx.lineTo(x + size - 2, yy - 9); ctx.lineTo(x + size * 0.62, yy + 2); ctx.closePath(); ctx.fill()
  }
  if (shape === 'human') {
    ctx.fillStyle = top
    ctx.beginPath(); ctx.arc(x + size / 2, yy - 5, 6, 0, Math.PI * 2); ctx.fill()
  }

  ctx.fillStyle = body
  ctx.beginPath(); ctx.roundRect(x, yy, size, size, 10); ctx.fill()
  ctx.fillStyle = top
  ctx.beginPath(); ctx.roundRect(x + 4, yy + 3, size - 8, size * 0.34, 7); ctx.fill()
  ctx.strokeStyle = 'rgba(40, 44, 30, 0.35)'; ctx.lineWidth = 1.5
  ctx.beginPath(); ctx.roundRect(x, yy, size, size, 10); ctx.stroke()
}

function drawBar(x, y, w, h, ratio, color) {
  ctx.fillStyle = 'rgba(28, 30, 20, 0.8)'
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2)
  ctx.fillStyle = color
  ctx.fillRect(x, y, w * Math.max(0, Math.min(1, ratio)), h)
}

function drawTargetMark(e) {
  const pad = 7, len = 10
  const x0 = e.x - pad, y0 = e.y - pad
  const x1 = e.x + e.size + pad, y1 = e.y + e.size + pad
  ctx.strokeStyle = targetLocked ? 'rgba(255, 216, 120, 0.95)' : 'rgba(240, 240, 220, 0.5)'
  ctx.lineWidth = targetLocked ? 3 : 2
  ctx.beginPath()
  ctx.moveTo(x0, y0 + len); ctx.lineTo(x0, y0); ctx.lineTo(x0 + len, y0)
  ctx.moveTo(x1 - len, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y0 + len)
  ctx.moveTo(x0, y1 - len); ctx.lineTo(x0, y1); ctx.lineTo(x0 + len, y1)
  ctx.moveTo(x1 - len, y1); ctx.lineTo(x1, y1); ctx.lineTo(x1, y1 - len)
  ctx.stroke()
  const t = ENEMY_TYPES[e.kind]
  if (!t.isDummy) outlineText(t.name, cx(e), e.y - 30, 'rgba(255, 244, 214, 0.98)', 'bold 13px sans-serif')
}

function drawEnemy(e) {
  const t = ENEMY_TYPES[e.kind]
  let body = t.body, top = t.top
  if (e.state !== 'chase' && !t.isDummy) { body = shade(t.body, -14); top = shade(t.top, -14) }
  if (e.attackTime >= 0 && e.attackTime < ENEMY_WINDUP) { body = '#e08a3c'; top = '#f0a052' }
  if (e.hitFlash > 0) { body = '#fff2cc'; top = '#fffae4' }

  drawToken(e.x, e.y, e.size, body, top, t.shape, e.bob)

  if (e.attackTime >= 0 && e.attackTime < ENEMY_WINDUP) {
    const p = e.attackTime / ENEMY_WINDUP
    ctx.strokeStyle = `rgba(255, 176, 92, ${0.28 + 0.45 * p})`
    ctx.lineWidth = 3
    ctx.beginPath(); ctx.arc(cx(e), cy(e), 22 + 20 * p, 0, Math.PI * 2); ctx.stroke()
  }

  if (t.isDummy) {
    ctx.fillStyle = '#8a7048'; ctx.fillRect(cx(e) - 3, e.y + e.size, 6, 14)
    outlineText(e.kind === 'redDummy' ? '붉은 허수아비 (시험용)' : '허수아비', cx(e), e.y - 14,
      e.kind === 'redDummy' ? 'rgba(255, 176, 164, 0.98)' : 'rgba(248, 232, 190, 0.95)', 'bold 12px sans-serif')
    return
  }

  if (e.hp < e.maxHp) drawBar(e.x, e.y - 10, e.size, 4, e.hp / e.maxHp, e.isBoss ? '#e0705a' : '#8fc46a')
  outlineText('Lv' + t.level, cx(e), e.y - 15, levelColor(t.level), e.isBoss ? 'bold 14px sans-serif' : 'bold 12px sans-serif')
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16)
  const r = Math.max(0, Math.min(255, (n >> 16) + amt))
  const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt))
  const b = Math.max(0, Math.min(255, (n & 255) + amt))
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')
}

function drawMerchant() {
  drawToken(merchant.x, merchant.y, merchant.size, '#9a72a8', '#b48ac0', 'human', 0)
  ctx.fillStyle = '#a8823f'; ctx.fillRect(merchant.x - 34, merchant.y + 26, 108, 8)
  ctx.fillStyle = PAL.gold; ctx.fillRect(merchant.x - 34, merchant.y + 22, 108, 5)
  outlineText(merchant.name, cx(merchant), merchant.y - 10, 'rgba(255, 240, 206, 0.98)', 'bold 13px sans-serif')
  if (Math.hypot(cx(player) - cx(merchant), cy(player) - cy(merchant)) < TALK_RANGE && !shopOpen) {
    outlineText('눌러서 거래', cx(merchant), merchant.y - 28, 'rgba(255, 220, 140, 0.98)', '13px sans-serif')
  }
}

function drawBoard() {
  drawShadow(cx(board), board.y + board.size + 4, 26)
  ctx.fillStyle = '#6b5236'
  ctx.fillRect(board.x + 6, board.y + 20, 8, 34)
  ctx.fillRect(board.x + 26, board.y + 20, 8, 34)
  ctx.fillStyle = '#cbb489'
  ctx.beginPath(); ctx.roundRect(board.x - 16, board.y - 16, 72, 46, 5); ctx.fill()
  ctx.strokeStyle = '#7a5f3c'; ctx.lineWidth = 3
  ctx.beginPath(); ctx.roundRect(board.x - 16, board.y - 16, 72, 46, 5); ctx.stroke()
  ctx.fillStyle = 'rgba(70, 56, 34, 0.5)'
  for (let i = 0; i < 3; i++) ctx.fillRect(board.x - 8, board.y - 6 + i * 10, 56, 3)
  outlineText(board.name, cx(board), board.y - 26, 'rgba(255, 240, 206, 0.98)', 'bold 13px sans-serif')
  if (Math.hypot(cx(player) - cx(board), cy(player) - cy(board)) < TALK_RANGE && !questOpen) {
    outlineText(quest.done ? '완료! 눌러 보상' : '눌러서 의뢰', cx(board), board.y - 44,
      quest.done ? 'rgba(150, 216, 240, 0.98)' : 'rgba(255, 220, 140, 0.98)', '13px sans-serif')
  }
}

function drawNpc(n) {
  drawToken(n.x, n.y, n.size, n.body, n.top, 'human', 0)
  outlineText(n.name, cx(n), n.y - 10, 'rgba(248, 236, 208, 0.95)', 'bold 12px sans-serif')
  if (n.talk > 0) outlineText('『 ' + n.line + ' 』', cx(n), n.y - 30, 'rgba(255, 248, 224, 0.98)', '13px sans-serif')
}

function drawDrops() {
  for (const d of drops) {
    if (!visible(d.x, d.y)) continue
    const lift = Math.sin(d.bob) * 3
    drawShadow(d.x, d.y + 10, 9)
    if (d.kind === 'gold') {
      ctx.fillStyle = '#e0b040'; ctx.beginPath(); ctx.arc(d.x, d.y + lift, 8, 0, Math.PI * 2); ctx.fill()
      ctx.fillStyle = '#f8dc86'; ctx.beginPath(); ctx.arc(d.x - 2, d.y - 2 + lift, 3.5, 0, Math.PI * 2); ctx.fill()
    } else {
      ctx.fillStyle = '#5fa85a'; ctx.beginPath(); ctx.ellipse(d.x, d.y + lift, 6, 9, 0.5, 0, Math.PI * 2); ctx.fill()
      ctx.fillStyle = '#9adc94'; ctx.beginPath(); ctx.ellipse(d.x - 2, d.y - 2 + lift, 3, 5, 0.5, 0, Math.PI * 2); ctx.fill()
    }
  }
}

/* 다람검객 토큰 */
function drawPlayer() {
  for (const a of afterimages) {
    ctx.globalAlpha = (a.life / a.maxLife) * 0.35
    ctx.fillStyle = PAL.navy
    ctx.beginPath(); ctx.roundRect(a.x, a.y, a.size, a.size, 10); ctx.fill()
  }
  ctx.globalAlpha = 1

  const x = player.x, y = player.y, s = player.size
  drawShadow(x + s / 2, y + s + 3, s * 0.52)

  const tailSide = player.faceX >= 0 ? -1 : 1
  ctx.fillStyle = PAL.fur
  ctx.beginPath()
  ctx.ellipse(x + s / 2 + tailSide * (s * 0.62), y + s * 0.42, s * 0.30, s * 0.46, tailSide * 0.4, 0, Math.PI * 2)
  ctx.fill()
  ctx.fillStyle = PAL.furLight
  ctx.beginPath()
  ctx.ellipse(x + s / 2 + tailSide * (s * 0.66), y + s * 0.32, s * 0.17, s * 0.26, tailSide * 0.4, 0, Math.PI * 2)
  ctx.fill()

  ctx.fillStyle = PAL.fur
  ctx.beginPath(); ctx.moveTo(x + 5, y + 9); ctx.lineTo(x + 2, y - 8); ctx.lineTo(x + s * 0.36, y + 2); ctx.closePath(); ctx.fill()
  ctx.beginPath(); ctx.moveTo(x + s - 5, y + 9); ctx.lineTo(x + s - 2, y - 8); ctx.lineTo(x + s * 0.64, y + 2); ctx.closePath(); ctx.fill()

  ctx.fillStyle = PAL.navy
  ctx.beginPath(); ctx.roundRect(x, y, s, s, 10); ctx.fill()
  ctx.fillStyle = PAL.fur
  ctx.beginPath(); ctx.roundRect(x + 3, y + 2, s - 6, s * 0.38, 8); ctx.fill()
  ctx.fillStyle = PAL.navy
  ctx.fillRect(x + 3, y + 4, s - 6, 6)
  ctx.fillStyle = PAL.gold
  ctx.beginPath(); ctx.arc(x + s / 2, y + 7, 3, 0, Math.PI * 2); ctx.fill()
  ctx.fillStyle = PAL.cream
  ctx.fillRect(x + 4, y + s * 0.52, s - 8, 5)
  ctx.fillStyle = PAL.teal
  ctx.fillRect(x + 4, y + s * 0.62, s - 8, 4)
  ctx.strokeStyle = 'rgba(30, 34, 24, 0.4)'; ctx.lineWidth = 1.5
  ctx.beginPath(); ctx.roundRect(x, y, s, s, 10); ctx.stroke()

  if (player.hurtTimer > 0) {
    ctx.strokeStyle = 'rgba(255, 244, 214, 0.55)'; ctx.lineWidth = 2
    ctx.strokeRect(x - 3, y - 3, s + 6, s + 6)
  }
  if (dodge.time >= 0 || step.time >= 0) {
    ctx.strokeStyle = 'rgba(180, 226, 255, 0.75)'; ctx.lineWidth = 2
    ctx.beginPath(); ctx.arc(cx(player), cy(player), s * 0.8, 0, Math.PI * 2); ctx.stroke()
  }
  outlineText('Lv' + player.level + ' 다람검객', cx(player), y - 12, 'rgba(255, 236, 176, 0.98)', 'bold 12px sans-serif')
}

function drawLevelFx() {
  if (levelFx <= 0) return
  const t = 1 - levelFx / 50
  const px = cx(player), py = cy(player)
  const g = ctx.createLinearGradient(px, py - 220, px, py + 30)
  g.addColorStop(0, 'rgba(255, 226, 150, 0)')
  g.addColorStop(0.55, `rgba(255, 226, 150, ${0.5 * (1 - t)})`)
  g.addColorStop(1, `rgba(255, 248, 208, ${0.7 * (1 - t)})`)
  ctx.fillStyle = g
  const halfW = 34 * (1 - t * 0.5)
  ctx.fillRect(px - halfW, py - 220, halfW * 2, 250)
  ctx.strokeStyle = `rgba(255, 236, 176, ${0.8 * (1 - t)})`
  ctx.lineWidth = 4
  ctx.beginPath(); ctx.ellipse(px, py + 20, 70 * (0.4 + t), 22 * (0.4 + t), 0, 0, Math.PI * 2); ctx.stroke()
  for (let i = 0; i < 8; i++) {
    const a = i * (Math.PI / 4) + t * 2
    const r = 30 + t * 90
    ctx.fillStyle = `rgba(255, 232, 160, ${0.9 * (1 - t)})`
    ctx.beginPath(); ctx.arc(px + Math.cos(a) * r, py + Math.sin(a) * r * 0.5 - t * 40, 4 * (1 - t) + 1.5, 0, Math.PI * 2); ctx.fill()
  }
}

function drawSwing() {
  if (attack.time < 0) return
  const angle = Math.atan2(player.faceY, player.faceX)
  const px = cx(player), py = cy(player)
  const strong = (combo + 1) % 3 === 0
  const blade = weapon().blade
  if (attack.time < ATTACK_WINDUP) {
    const t = attack.time / ATTACK_WINDUP
    ctx.strokeStyle = strong ? `rgba(255, 224, 140, ${0.22 + 0.4 * t})` : `rgba(248, 240, 210, ${0.2 + 0.3 * t})`
    ctx.lineWidth = strong ? 5 : 3
    ctx.beginPath(); ctx.arc(px, py, 28 + 14 * t, angle - 1.5 - 0.7 * t, angle - 0.55); ctx.stroke()
    return
  }
  const p = (attack.time - ATTACK_WINDUP) / ATTACK_RECOVER
  const reach = (ATTACK_REACH + 20) * (0.7 + 0.3 * p) * (strong ? 1.25 : 1)
  ctx.fillStyle = strong ? `rgba(255, 224, 140, ${0.5 * (1 - p)})` : hexA(blade, 0.42 * (1 - p))
  ctx.beginPath(); ctx.moveTo(px, py)
  ctx.arc(px, py, reach, angle - (strong ? 1.25 : 0.9), angle + (strong ? 1.25 : 0.9))
  ctx.closePath(); ctx.fill()
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16)
  return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`
}

function drawSpin() {
  if (spin.time < 0) return
  const px = cx(player), py = cy(player)
  if (spin.time < SPIN_WINDUP) {
    const t = spin.time / SPIN_WINDUP
    ctx.strokeStyle = `rgba(255, 196, 110, ${0.28 + 0.5 * t})`
    ctx.lineWidth = 4
    ctx.beginPath(); ctx.arc(px, py, SPIN_RADIUS * (1.25 - 0.45 * t), 0, Math.PI * 2); ctx.stroke()
    return
  }
  const t = (spin.time - SPIN_WINDUP) / SPIN_RECOVER
  const sp = t * Math.PI * 3
  ctx.fillStyle = `rgba(255, 212, 130, ${0.32 * (1 - t)})`
  ctx.beginPath(); ctx.moveTo(px, py); ctx.arc(px, py, SPIN_RADIUS, sp, sp + 2.2); ctx.closePath(); ctx.fill()
}

function drawWindCast() {
  if (wind.time < 0 || wind.time >= WIND_WINDUP) return
  const t = wind.time / WIND_WINDUP
  const px = cx(player), py = cy(player)
  const angle = Math.atan2(player.faceY, player.faceX)
  ctx.strokeStyle = `rgba(150, 220, 240, ${0.3 + 0.5 * t})`
  ctx.lineWidth = 3
  ctx.beginPath(); ctx.arc(px, py, 24 + 16 * t, angle - 1.1, angle + 1.1); ctx.stroke()
}

function drawProjectiles() {
  for (const pr of projectiles) {
    ctx.save()
    ctx.translate(pr.x, pr.y)
    ctx.rotate(pr.angle)
    const a = Math.min(1, pr.life / 20)
    ctx.fillStyle = `rgba(160, 226, 244, ${0.75 * a})`
    ctx.beginPath(); ctx.ellipse(0, 0, 30, 9, 0, 0, Math.PI * 2); ctx.fill()
    ctx.fillStyle = `rgba(240, 252, 255, ${0.9 * a})`
    ctx.beginPath(); ctx.ellipse(6, 0, 16, 4, 0, 0, Math.PI * 2); ctx.fill()
    ctx.restore()
  }
}

function drawEffects() {
  for (const r of rings) {
    const t = 1 - r.life / r.maxLife
    ctx.strokeStyle = r.color.replace(/[\d.]+\)$/, (1 - t).toFixed(2) + ')')
    ctx.lineWidth = 3
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.4 + 0.8 * t), 0, Math.PI * 2); ctx.stroke()
  }
  for (const p of particles) {
    ctx.globalAlpha = (p.life / p.maxLife) * 0.85
    ctx.fillStyle = p.color
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size)
  }
  ctx.globalAlpha = 1
  for (const f of floatTexts) {
    ctx.globalAlpha = Math.min(1, f.life / (f.maxLife * 0.5))
    outlineText(f.text, f.x, f.y, f.color, 'bold ' + f.size + 'px sans-serif')
  }
  ctx.globalAlpha = 1
}

/* ---------- UI ---------- */
function drawPanel(x, y, w, h) {
  ctx.fillStyle = 'rgba(40, 38, 26, 0.92)'
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill()
  ctx.strokeStyle = hexA(PAL.gold, 0.7); ctx.lineWidth = 2; ctx.stroke()
  ctx.strokeStyle = hexA(PAL.gold, 0.22); ctx.lineWidth = 1
  ctx.beginPath(); ctx.roundRect(x + 4, y + 4, w - 8, h - 8, 6); ctx.stroke()
}

function drawRoundButton(pos, label, sub, ready, ratio) {
  ctx.fillStyle = ready ? 'rgba(46, 58, 99, 0.8)' : 'rgba(44, 40, 30, 0.55)'
  ctx.beginPath(); ctx.arc(pos.x, pos.y, BUTTON_RADIUS, 0, Math.PI * 2); ctx.fill()
  ctx.strokeStyle = ready ? hexA(PAL.gold, 0.9) : 'rgba(160, 146, 116, 0.3)'
  ctx.lineWidth = 3; ctx.stroke()
  if (ratio > 0) {
    ctx.strokeStyle = hexA(PAL.gold, 0.65); ctx.lineWidth = 4
    ctx.beginPath()
    ctx.arc(pos.x, pos.y, BUTTON_RADIUS, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - ratio))
    ctx.stroke()
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillStyle = ready ? 'rgba(252, 238, 200, 0.96)' : 'rgba(200, 186, 160, 0.42)'
  ctx.font = 'bold 14px sans-serif'
  ctx.fillText(label, pos.x, pos.y - (sub ? 7 : 0))
  if (sub) {
    ctx.font = '12px sans-serif'
    ctx.fillStyle = 'rgba(240, 218, 170, 0.7)'
    ctx.fillText(sub, pos.x, pos.y + 12)
  }
}

}

function drawMiniMap() {
  const w = 116
  const h = w * (WORLD_H / WORLD_W)
  const x = canvas.width - w - 18
  const y = 18
  drawPanel(x - 4, y - 4, w + 8, h + 8)
  const sx = w / WORLD_W, sy = h / WORLD_H
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip()
  for (const r of REGIONS) {
    const band = RINGS[r.ring]
    const a0 = r.sector * SECTOR_SPAN - SECTOR_SPAN / 2
    ctx.fillStyle = r.tint.replace(/[\d.]+\)$/, '0.9)')
    ctx.beginPath()
    ctx.arc(x + VILLAGE.x * sx, y + VILLAGE.y * sy, band.r1 * sx, a0, a0 + SECTOR_SPAN)
    ctx.arc(x + VILLAGE.x * sx, y + VILLAGE.y * sy, band.r0 * sx, a0 + SECTOR_SPAN, a0, true)
    ctx.closePath(); ctx.fill()
  }
  ctx.fillStyle = 'rgba(226, 200, 146, 0.8)'
  ctx.beginPath(); ctx.arc(x + VILLAGE.x * sx, y + VILLAGE.y * sy, VILLAGE.r * sx, 0, Math.PI * 2); ctx.fill()
  for (const e of enemies) {
    if (ENEMY_TYPES[e.kind].isDummy) continue
    if (!e.isBoss) continue
    ctx.fillStyle = '#f08050'
    ctx.fillRect(x + e.x * sx - 2, y + e.y * sy - 2, 5, 5)
  }
  ctx.fillStyle = PAL.gold
  ctx.fillRect(x + player.x * sx - 2, y + player.y * sy - 2, 5, 5)
  ctx.restore()

  const zone = currentRegion < 0 ? '마을' : REGIONS[currentRegion].name
  ctx.textAlign = 'center'; ctx.textBaseline = 'top'
  ctx.font = 'bold 12px sans-serif'
  ctx.fillStyle = 'rgba(252, 238, 200, 0.9)'
  ctx.fillText(zone, x + w / 2, y + h + 10)
}

const PETAL_COLORS = ['rgba(255, 208, 220, 0.75)', 'rgba(255, 236, 196, 0.7)', 'rgba(226, 244, 210, 0.65)', 'rgba(255, 250, 236, 0.6)']
const petals = []
function seedPetals() {
  petals.length = 0
  const n = Math.round((canvas.width * canvas.height) / 26000) + 18
  for (let i = 0; i < n; i++) {
    petals.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: 0.18 + Math.random() * 0.42,
      vy: 0.28 + Math.random() * 0.5,
      r: 2.2 + Math.random() * 3.4,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.012 + Math.random() * 0.02,
      c: PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)]
    })
  }
}
seedPetals()
window.addEventListener('resize', seedPetals)

function drawPetals() {
  for (const p of petals) {
    p.sway += p.swaySpeed
    p.x += p.vx + Math.sin(p.sway) * 0.5
    p.y += p.vy
    if (p.y > canvas.height + 12) { p.y = -12; p.x = Math.random() * canvas.width }
    if (p.x > canvas.width + 12) p.x = -12
    ctx.fillStyle = p.c
    ctx.beginPath()
    ctx.ellipse(p.x, p.y, p.r, p.r * 0.62, p.sway, 0, Math.PI * 2)
    ctx.fill()
  }
}

function drawSunlight() {

function drawVignette() {
  if (hurtFlash > 0) {
    const a = (hurtFlash / 26) * 0.5
    const g = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.28,
      canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.62)
    g.addColorStop(0, 'rgba(200, 40, 40, 0)')
    g.addColorStop(1, `rgba(190, 30, 30, ${a})`)
    ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height)
  }
  const ratio = player.hp / player.maxHp
  if (ratio < 0.3 && !gameOver) {
    const pulse = 0.14 + 0.1 * Math.sin(performance.now() / 190)
    const g = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.3,
      canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.6)
    g.addColorStop(0, 'rgba(160, 20, 20, 0)')
    g.addColorStop(1, `rgba(160, 20, 20, ${pulse})`)
    ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height)
    ctx.textAlign = 'center'; ctx.textBaseline = 'top'
    ctx.font = 'bold 15px sans-serif'
    ctx.fillStyle = `rgba(255, 150, 140, ${0.6 + 0.4 * Math.sin(performance.now() / 190)})`
    ctx.fillText('위험', canvas.width / 2, 112)
  }
}

  ctx.beginPath(); ctx.roundRect(yes.x, yes.y, yes.w, yes.h, 6); ctx.fill()
  ctx.strokeStyle = 'rgba(220, 138, 122, 0.8)'; ctx.lineWidth = 1.5; ctx.stroke()
  ctx.fillStyle = 'rgba(255, 228, 214, 0.98)'; ctx.font = 'bold 16px sans-serif'
  ctx.fillText('처음부터', yes.x + yes.w / 2, yes.y + yes.h / 2)
  ctx.fillStyle = 'rgba(60, 54, 38, 0.85)'
  ctx.beginPath(); ctx.roundRect(no.x, no.y, no.w, no.h, 6); ctx.fill()
  ctx.strokeStyle = hexA(PAL.gold, 0.6); ctx.lineWidth = 1.5; ctx.stroke()
  ctx.fillStyle = 'rgba(252, 238, 200, 0.95)'
  ctx.fillText('그만두기', no.x + no.w / 2, no.y + no.h / 2)
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(24, 26, 16, 0.74)'; ctx.fillRect(0, 0, canvas.width, canvas.height)
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillStyle = '#f2dcae'; ctx.font = 'bold 44px sans-serif'
  ctx.fillText('쓰러졌다', canvas.width / 2, canvas.height / 2 - 60)
  ctx.font = '18px sans-serif'; ctx.fillStyle = 'rgba(240, 218, 170, 0.9)'
  ctx.fillText(realmName() + ' · ' + jobName() + ' ' + player.level + '단   처치 ' + kills, canvas.width / 2, canvas.height / 2 - 8)
  ctx.font = '15px sans-serif'; ctx.fillStyle = 'rgba(240, 160, 152, 0.9)'
  ctx.fillText('마을로 돌아가면 엽전 30%를 잃소', canvas.width / 2, canvas.height / 2 + 30)
  ctx.font = '17px sans-serif'; ctx.fillStyle = 'rgba(240, 218, 170, 0.85)'
  ctx.fillText('화면을 누르면 마을에서 깨어남', canvas.width / 2, canvas.height / 2 + 72)
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height)
  ctx.save()
  let ox = 0, oy = 0
  if (shake > 0.5) { ox = (Math.random() - 0.5) * shake; oy = (Math.random() - 0.5) * shake }
  ctx.translate(-camera.x + ox, -camera.y + oy)

  drawGround()
  drawDrops()

  const layers = []
  for (const s of scenery) {
    if (s.kind === 'grass' || s.kind === 'pond' || s.kind === 'flower' || s.kind === 'rock' || s.kind === 'reed') continue
    if (!visible(s.x, s.y, 140)) continue
    layers.push({ y: s.y, prop: s })
  }
  for (const h of houses) layers.push({ y: h.y + h.h / 2, house: h })
  for (const e of enemies) { if (visible(e.x, e.y, 120)) layers.push({ y: e.y + e.size, enemy: e }) }
  layers.push({ y: merchant.y + merchant.size, isMerchant: true })
  layers.push({ y: board.y + board.size, isBoard: true })
  for (const n of npcs) layers.push({ y: n.y + n.size, npc: n })
  layers.push({ y: player.y + player.size, isPlayer: true })
  layers.sort((a, b) => a.y - b.y)

  for (const item of layers) {
    if (item.prop) drawProp(item.prop)
    else if (item.house) drawHouse(item.house)
    else if (item.enemy) drawEnemy(item.enemy)
    else if (item.npc) drawNpc(item.npc)
    else if (item.isMerchant) drawMerchant()
    else if (item.isBoard) drawBoard()
    else drawPlayer()
  }

  if (target && enemies.includes(target)) drawTargetMark(target)
  drawSwing()
  drawSpin()
  drawWindCast()
  drawProjectiles()
  drawLevelFx()
  drawEffects()
  ctx.restore()

  drawSunlight()
  drawPetals()

  if (levelFx > 0) {
    ctx.fillStyle = `rgba(255, 240, 190, ${0.16 * (levelFx / 50)})`
    ctx.fillRect(0, 0, canvas.width, canvas.height)
  }

  drawHud()
  drawMiniMap()
  drawSideButtons()
  drawRoundButton(attackBtn(), '베기', '', !busy() && attack.gap <= 0 && !paused(), 0)
  drawRoundButton(dodgeBtn(), '구르기', '', dodge.cooldown <= 0 && !busy() && !paused(), dodge.cooldown / DODGE_COOLDOWN)
  drawRoundButton(spinBtn(), '회전참격', '', spin.cooldown <= 0 && !busy() && !paused(), spin.cooldown / spinCd())
  drawRoundButton(windBtn(), '바람베기', '', wind.cooldown <= 0 && !busy() && !paused(), wind.cooldown / windCd())
  drawRoundButton(stepBtn(), '그림자밟기', '', step.cooldown <= 0 && !busy() && !paused(), step.cooldown / stepCd())
  drawRoundButton(potionBtn(), '약초', String(player.potions), player.potions > 0 && !paused(), 0)
  drawJoystick()
  drawBossBar()
  drawZoneBanner()
  drawVignette()
  drawLevelBanner()

  if (shopOpen) drawShop()
  if (questOpen) drawQuest()
  if (statusOpen) drawStatus()
  if (pickOptions) drawPick()
  if (gameOver) drawGameOver()
  if (confirmReset) drawConfirmReset()
}

function loop() {
  if (hitStop > 0) hitStop -= 1
  else update()
  draw()
  requestAnimationFrame(loop)
}

loop()
</script>
